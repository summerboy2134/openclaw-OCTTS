services:
  redis:
    image: redis:7-alpine
    container_name: octts-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  octts:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: octts-app
    restart: unless-stopped
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OCTTS_MEMORY_BACKEND=redis
      - OCTTS_HISTORY_DIR_PATH=/app/memory/history
      - OCTTS_DATABASE_URL=sqlite:////app/memory/octts_screening.db
      - PIP_EXTRA_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/
      - TZ=Asia/Shanghai
    ports:
      - "3003:8000"
    volumes:
      - ./memory:/app/memory

volumes:
  redis_data:
