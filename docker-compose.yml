services:
  redis:
    image: redis:7-alpine
    container_name: octts-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  octts:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: octts-app
    restart: unless-stopped
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      OCTTS_MEMORY_BACKEND: redis
    ports:
      - "8000:8000"
    volumes:
      - octts_memory:/app/memory

volumes:
  redis_data:
  octts_memory:
